<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Name Loom</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
<h1>✨ The Name Loom ✨</h1>
<h3>Generate names for real or fictional settings</h3>
<label for="languages" id="languagesLabel">Language</label>
<select id="languages"></select>
<label for="blendCheckbox" id="blendCheckboxLabel">Blend with another language?</label>
<input type="checkbox" id="blendCheckbox" onchange="blend()">
<label for="languagesOther" id="languagesOtherLabel"></label>
<select id="languagesOther" onchange="updateWeightLabel()"></select>
<label for="weight" id="weightLabel"></label>
<input type="range" id="weight" min="0" max="1" step="0.1" oninput="updateWeightLabel()">
<span id="weightNum"></span>
<label for="number" id="numberLabel">Number of names</label>
<input type="number" id="number">
<span id="numberError"></span>
<button id="generateBtn" onclick="generate()">Generate</button>
<ul id="results"></ul>
<script src="script.js"></script>
</body>
</html>
