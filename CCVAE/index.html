<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Name Generator</title>
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<label for="languages">Choose language:</label>
<select id="languages"></select>
<label for="languagesOther" id="languagesOtherLabel"></label>
<select id="languagesOther"></select>
<label for="weight" id="weightLabel"></label>
<input type="range" id="weight" min="0" max="1" step="0.1" oninput="updateWeightLabel()">
<span id="weightNum"></span>
<span id="weightError" style="color: red;"></span>
<label for="number">Number:</label>
<input type="number" id="number">
<span id="numberError" style="color: red;"></span>
<button id="generateBtn" onclick="generate()">Generate</button>
<label for="blendCheckbox">Blend:</label>
<input type="checkbox" id="blendCheckbox" onchange="blend()">
<ul id="results"></ul>
<script src="script.js"></script>
</body>
</html>
